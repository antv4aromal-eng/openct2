version: "3.8"

services:
  # ===========================================================================
  # REDPANDA (Kafka-Compatible Distributed Event Streaming Platform)
  # ===========================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: atip-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Console (Kafka UI & Topic Inspector)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.2
    container_name: atip-redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:29092"

  # ===========================================================================
  # REDIS (Distributed Token-Bucket Rate Limiting & Fast State Cache)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: atip-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # NEO4J (STIX 2.1 Graph Database for Connected Adversary Intelligence)
  # ===========================================================================
  neo4j:
    image: neo4j:5.14.0-community
    container_name: atip-neo4j
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/opencti_atip_pass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # OPENSEARCH (Full-Text Defanged Search & Observable Index)
  # ===========================================================================
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: atip-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # CONTROL PLANE API (FastAPI Gateway & Agent Execution Engine)
  # ===========================================================================
  control-plane-api:
    build:
      context: .
      dockerfile: services/control-plane-api/Dockerfile
    container_name: atip-control-plane-api
    depends_on:
      - redpanda
      - redis
      - neo4j
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKERS: "redpanda:29092"
      REDIS_URL: "redis://redis:6379/0"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "opencti_atip_pass"
      OPENSEARCH_URL: "http://opensearch:9200"

  # ===========================================================================
  # INGEST MERGER WORKER (Deterministic Deduplication & Confidence Merger)
  # ===========================================================================
  ingest-merger-worker:
    build:
      context: .
      dockerfile: services/ingest-merger-worker/Dockerfile
    container_name: atip-ingest-merger-worker
    depends_on:
      - redpanda
      - redis
      - neo4j
    environment:
      KAFKA_BROKERS: "redpanda:29092"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_RAW_TOPIC: "atip.ingest.raw"
      KAFKA_CDC_TOPIC: "atip.graph.cdc"

  # ===========================================================================
  # CORRELATION RULE ENGINE (Graph CDC Stream Processor & 2nd-Hop Pivots)
  # ===========================================================================
  correlation-rule-engine:
    build:
      context: .
      dockerfile: services/correlation-rule-engine/Dockerfile
    container_name: atip-correlation-rule-engine
    depends_on:
      - redpanda
      - redis
    environment:
      KAFKA_BROKERS: "redpanda:29092"
      KAFKA_CDC_TOPIC: "atip.graph.cdc"
      KAFKA_ENRICHMENT_TOPIC: "atip.enrichment.requests"

  # ===========================================================================
  # WEBAPP (React + Tailwind Interactive Graph & Multi-Agent Dashboard)
  # ===========================================================================
  webapp:
    image: node:20-alpine
    container_name: atip-webapp
    working_dir: /app
    volumes:
      - ./webapp:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: "http://localhost:8000"

volumes:
  redpanda_data:
  redis_data:
  neo4j_data:
  opensearch_data:
